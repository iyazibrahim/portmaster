# Small VPS (~4GB RAM) + Dokploy.
# Build on GitHub Actions → GHCR; Dokploy only pulls (never `docker compose build` / --build on this host).
# See .github/workflows/docker-build.yml and README "Dokploy deploy".

name: tiangpass

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tiangpass
      POSTGRES_PASSWORD: tiangpass
      POSTGRES_DB: tiangpass
    command:
      - postgres
      - -c
      - shared_buffers=96MB
      - -c
      - effective_cache_size=256MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - work_mem=2MB
      - -c
      - max_connections=30
      - -c
      - wal_buffers=4MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=1.1
      - -c
      - jit=off
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tiangpass_pg:/var/lib/postgresql/data
    shm_size: 96mb
    mem_limit: 448m
    mem_reservation: 192m
    memswap_limit: 640m
    cpus: "0.75"
    oom_score_adj: -400
    init: true
    logging:
      driver: json-file
      options:
        max-size: "8m"
        max-file: "2"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiangpass -d tiangpass"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    # Prebuilt by GitHub Actions. Dokploy must pull this — do not enable --build in Dokploy command.
    image: ${APP_IMAGE:-ghcr.io/iyazibrahim/portmaster:latest}
    restart: unless-stopped
    ports:
      - "${PORT:-43127}:43127"
    environment:
      DATABASE_URL: postgresql://tiangpass:tiangpass@postgres:5432/tiangpass
      AUTH_SECRET: ${AUTH_SECRET:-tiangpass-dev-secret-change-in-production-32chars}
      APP_URL: ${APP_URL:-http://127.0.0.1:43127}
      AUTH_URL: ${APP_URL:-http://127.0.0.1:43127}
      PORT: "43127"
      AUTH_TRUST_HOST: "true"
      NODE_OPTIONS: --max-old-space-size=512
      UV_THREADPOOL_SIZE: "2"
      # Runtime secrets from Dokploy env (not GitHub Actions). Empty = mock pay.
      HITPAY_API_KEY: ${HITPAY_API_KEY:-}
      HITPAY_API_URL: ${HITPAY_API_URL:-https://api.sandbox.hit-pay.com}
      HITPAY_WEBHOOK_SALT: ${HITPAY_WEBHOOK_SALT:-}
      HITPAY_CURRENCY: ${HITPAY_CURRENCY:-MYR}
      HITPAY_PAYMENT_METHODS: ${HITPAY_PAYMENT_METHODS:-grabpay_direct,shopee_pay,atome}
      CRON_SECRET: ${CRON_SECRET:-}
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 768m
    mem_reservation: 384m
    memswap_limit: 1024m
    cpus: "1.25"
    oom_score_adj: 200
    init: true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:43127/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s

volumes:
  tiangpass_pg:
