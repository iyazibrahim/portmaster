services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: tiangpass
      POSTGRES_PASSWORD: tiangpass
      POSTGRES_DB: tiangpass
    ports:
      - "5432:5432"
    volumes:
      - tiangpass_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiangpass -d tiangpass"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-43127}:43127"
    environment:
      DATABASE_URL: postgresql://tiangpass:tiangpass@postgres:5432/tiangpass
      AUTH_SECRET: ${AUTH_SECRET:-tiangpass-dev-secret-change-in-production-32chars}
      APP_URL: ${APP_URL:-http://127.0.0.1:43127}
      AUTH_URL: ${APP_URL:-http://127.0.0.1:43127}
      PORT: "43127"
      AUTH_TRUST_HOST: "true"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:43127/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  tiangpass_pg:
