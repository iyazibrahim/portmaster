# Small VPS (~4GB RAM). Prefer building on GitHub Actions (see .github/workflows/docker-build.yml)
# then: APP_IMAGE=ghcr.io/<owner>/portmaster:latest docker compose pull app && docker compose up -d app
# Host should still have 1–2GB swap. Avoid `docker compose build` on this box if possible.

name: tiangpass

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tiangpass
      POSTGRES_PASSWORD: tiangpass
      POSTGRES_DB: tiangpass
    command:
      - postgres
      - -c
      - shared_buffers=96MB
      - -c
      - effective_cache_size=256MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - work_mem=2MB
      - -c
      - max_connections=30
      - -c
      - wal_buffers=4MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=1.1
      - -c
      - jit=off
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tiangpass_pg:/var/lib/postgresql/data
    shm_size: 96mb
    mem_limit: 448m
    mem_reservation: 192m
    memswap_limit: 640m
    cpus: "0.75"
    oom_score_adj: -400
    init: true
    logging:
      driver: json-file
      options:
        max-size: "8m"
        max-file: "2"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiangpass -d tiangpass"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    # Prebuilt image from GHCR (CI). Override with APP_IMAGE=... on the VPS.
    # Local: omit APP_IMAGE and `docker compose build app` still works (tags as image name).
    image: ${APP_IMAGE:-ghcr.io/iyazibrahim/portmaster:latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Lower = safer if you ever build on a 4GB VPS; CI uses 4096 via the workflow.
        NODE_MAX_OLD_SPACE_SIZE: "1280"
    restart: unless-stopped
    ports:
      - "${PORT:-43127}:43127"
    environment:
      DATABASE_URL: postgresql://tiangpass:tiangpass@postgres:5432/tiangpass
      AUTH_SECRET: ${AUTH_SECRET:-tiangpass-dev-secret-change-in-production-32chars}
      APP_URL: ${APP_URL:-http://127.0.0.1:43127}
      AUTH_URL: ${APP_URL:-http://127.0.0.1:43127}
      PORT: "43127"
      AUTH_TRUST_HOST: "true"
      NODE_OPTIONS: --max-old-space-size=512
      UV_THREADPOOL_SIZE: "2"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 768m
    mem_reservation: 384m
    memswap_limit: 1024m
    cpus: "1.25"
    oom_score_adj: 200
    init: true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:43127/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s

volumes:
  tiangpass_pg:
