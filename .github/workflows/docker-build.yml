# Build on GitHub → push GHCR → trigger Dokploy (pull only, no VPS build).
#
# One-time Dokploy setup (required to stop OOM):
# 1. Settings → Registry: add ghcr.io (GitHub user + PAT with read:packages)
# 2. Compose app → Provider: use this repo’s docker-compose.yml
#    - App service image: ghcr.io/iyazibrahim/portmaster:latest
# 3. Compose → Advanced → Command: override so Dokploy does NOT pass --build
#    Example (adjust -p / -f to match Dokploy’s default shown in UI):
#      compose -p <project> -f ./docker-compose.yml pull
#      compose -p <project> -f ./docker-compose.yml up -d --remove-orphans
#    Or a single line based on Dokploy’s default, with --build removed and `pull` added.
# 4. GitHub repo → Settings → Secrets → Actions:
#      DOKPLOY_URL              e.g. https://panel.example.com
#      DOKPLOY_API_KEY          from Dokploy profile → API/CLI
#      DOKPLOY_COMPOSE_ID       from compose URL / API (preferred for this project)
#    OR DOKPLOY_APPLICATION_ID  if you deploy as a single Docker Application instead
#
# Flow: push main → Actions builds image → Dokploy pulls + restarts → Postgres stays up.

name: Docker build & Dokploy deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "prd/**"
  workflow_dispatch:

concurrency:
  group: docker-dokploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & push GHCR image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    outputs:
      short_sha: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NODE_MAX_OLD_SPACE_SIZE=4096
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Summary
        run: |
          {
            echo "## Image pushed to GHCR"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "Next job triggers **Dokploy** to pull this image (no build on VPS)."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-dokploy:
    name: Trigger Dokploy deploy
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Call Dokploy API
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
          SHORT_SHA: ${{ needs.build-and-push.outputs.short_sha }}
        run: |
          set -euo pipefail

          if [ -z "${DOKPLOY_URL:-}" ] || [ -z "${DOKPLOY_API_KEY:-}" ]; then
            echo "::warning::DOKPLOY_URL / DOKPLOY_API_KEY not set. Image is on GHCR; configure secrets to auto-deploy."
            exit 0
          fi

          BASE="${DOKPLOY_URL%/}"
          TITLE="CI ${GITHUB_SHA::7}"
          DESC="GHCR image after GitHub Actions build (no VPS next build)"

          if [ -n "${DOKPLOY_COMPOSE_ID:-}" ]; then
            echo "Triggering compose.deploy id=$DOKPLOY_COMPOSE_ID"
            HTTP=$(curl -sS -o /tmp/dokploy-out.json -w "%{http_code}" -X POST \
              "${BASE}/api/compose.deploy" \
              -H "accept: application/json" \
              -H "Content-Type: application/json" \
              -H "x-api-key: ${DOKPLOY_API_KEY}" \
              -d "{\"composeId\":\"${DOKPLOY_COMPOSE_ID}\",\"title\":\"${TITLE}\",\"description\":\"${DESC}\"}")
          elif [ -n "${DOKPLOY_APPLICATION_ID:-}" ]; then
            echo "Triggering application.deploy id=$DOKPLOY_APPLICATION_ID"
            HTTP=$(curl -sS -o /tmp/dokploy-out.json -w "%{http_code}" -X POST \
              "${BASE}/api/application.deploy" \
              -H "accept: application/json" \
              -H "Content-Type: application/json" \
              -H "x-api-key: ${DOKPLOY_API_KEY}" \
              -d "{\"applicationId\":\"${DOKPLOY_APPLICATION_ID}\",\"title\":\"${TITLE}\",\"description\":\"${DESC}\"}")
          else
            echo "::error::Set DOKPLOY_COMPOSE_ID (compose stack) or DOKPLOY_APPLICATION_ID (single app)."
            exit 1
          fi

          echo "HTTP $HTTP"
          cat /tmp/dokploy-out.json || true
          echo ""
          if [ "$HTTP" -lt 200 ] || [ "$HTTP" -ge 300 ]; then
            echo "::error::Dokploy deploy failed (HTTP $HTTP)"
            exit 1
          fi
          echo "Dokploy deploy queued."
